[pytest]
# Scoped configuration for the MARLIN Rhino MVP backend tests ONLY.
# Lives in backend/ so rootdir becomes backend/ and `import app...` resolves.
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --strict-config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
markers =
    unit: isolated unit tests (no network/DB)
    integration: app-level tests through the ASGI interface
